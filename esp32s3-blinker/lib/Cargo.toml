[package]
name = "lib"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-hal = { version = "1.1", default-features = false, features = ["esp32s3", "unstable"] }
esp-println = { version = "0.17", features = ["esp32s3"] }
heapless = "0.8"

# Wireless stack -- only the 5-minute work window needs it. Gated so a
# blink-and-sleep-only build stays lean. Versions: esp-radio 0.16 / esp-rtos
# 0.3 verified against docs; the embassy/alloc companions are best-effort,
# let `cargo add` correct them if resolution complains.
esp-radio = { version = "0.16", default-features = false, optional = true, features = ["esp32s3"] }
esp-rtos = { version = "0.3", optional = true, features = ["esp32s3", "esp-radio", "esp-alloc", "embassy"] }
esp-alloc = { version = "0.8", optional = true }
static-cell = { version = "2.1", optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-executor = { version = "0.9", optional = true }

[features]
default = []

# The work-window subsystems. Enabling any of wifi/bt pulls the radio stack.
wifi = ["_radio", "esp-radio/wifi"]
bt = ["_radio", "esp-radio/ble"]
coex = ["wifi", "bt", "esp-radio/coex"]
i2c-scan = []  # cheap, synchronous, no radio

# internal: shared radio/async plumbing for any wireless feature
_radio = [
  "dep:esp-radio", "dep:esp-rtos", "dep:esp-alloc",
  "dep:static-cell", "dep:embassy-time", "dep:embassy-executor",
]
