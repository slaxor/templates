[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal = { version = "1.1.1", features = ["esp32s3"] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }
esp-rom-sys = { version = "0.1.4", features = ["esp32s3"] }

[dependencies.lib]
path = "../lib"

[[bin]]
name = "firmware"
test = false
bench = false
