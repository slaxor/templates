[package]
name = "__PROJECT_NAME__-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "__PROJECT_NAME__"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
__PROJECT_NAME__ = { path = "../lib" }

embassy-executor = { version = "0.10.0", features = ["arch-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-time = { version = "0.5.1" }

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"

defmt = "1.1.0"
defmt-rtt = "1.2.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
