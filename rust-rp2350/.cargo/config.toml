# Based on rp-rs/rp-hal's rp235x-hal-examples config, trimmed to RISC-V only
# (this template targets the RP2350's Hazard3 RISC-V cores, not Cortex-M33).

[build]
target = "riscv32imac-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
# --nmagic: turns off page alignment of sections (saves flash space)
# -Trp235x_riscv.x: RP2350 RISC-V specific linker script; pulls in
#   riscv-rt's link.x itself (reverse of how Arm does it)
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Trp235x_riscv.x",
]

# load an elf, skipping unchanged flash sectors, verify it, and execute it
runner = "picotool load -u -v -x -t elf"
