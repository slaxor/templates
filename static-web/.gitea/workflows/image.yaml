name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: __IMAGE__
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: printf '%s' "${REGISTRY_TOKEN}" | docker login "${IMAGE%%/*}" -u "${REGISTRY_USER}" --password-stdin

      - name: Build
        run: docker build -t "${IMAGE}" -f Containerfile .

      - name: Push
        run: docker push "${IMAGE}"
