name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  image:
    runs-on: nix
    env:
      IMAGE: __IMAGE__
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-config
      KUBECONFIG: ${{ github.workspace }}/.kubeconfig
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          : "${REGISTRY_USER:?repository variable REGISTRY_USER is not set}"
          : "${REGISTRY_TOKEN:?repository secret REGISTRY_TOKEN is not set}"
          printf '%s' "${REGISTRY_TOKEN}" | nix develop --command crane auth login "${IMAGE%%/*}" -u "${REGISTRY_USER}" --password-stdin

      - name: Build and push
        run: nix develop --command just publish

      - name: Restart deployment
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          : "${KUBECONFIG_DATA:?repository secret KUBECONFIG is not set}"
          printf '%s' "${KUBECONFIG_DATA}" > "${KUBECONFIG}"
          nix develop --command just restart

      - name: Forget credentials
        if: always()
        run: rm -rf "${DOCKER_CONFIG}" "${KUBECONFIG}"
