apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: Always
          env:
            - name: SERVER_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: __NAMESPACE__
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web
  namespace: __NAMESPACE__
spec:
  secretName: web-tls
  issuerRef:
    kind: ClusterIssuer
    name: __CLUSTER_ISSUER__
  dnsNames:
    - __DOMAIN__
    - www.__DOMAIN__
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-canonical
  namespace: __NAMESPACE__
spec:
  redirectRegex:
    regex: ^https?://[^/]+(.*)
    replacement: https://__DOMAIN__${1}
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
  namespace: __NAMESPACE__
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`__DOMAIN__`)
      kind: Rule
      services:
        - name: web
          port: http
    - match: Host(`www.__DOMAIN__`)
      kind: Rule
      middlewares:
        - name: to-canonical
      services:
        - name: web
          port: http
  tls:
    secretName: web-tls
