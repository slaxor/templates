<ul class="pages">
{% for page in pages %}
  <li>
    <a href="{{ page.permalink }}">{{ page.title }}</a>
    {% if page.date %}<time datetime="{{ page.date }}">{{ page.date | date(format="%Y-%m-%d") }}</time>{% endif %}
  </li>
{% else %}
  <li class="muted">Nothing here yet.</li>
{% endfor %}
</ul>
